# Without Cache-Control, browsers keep index.html for a guessed time and run an outdated build
# against the current backend. Only hashed files under assets/ may be cached for good.
map $uri $cache_control {
  ~/assets/ "public, max-age=31536000, immutable";
  default "no-cache";
}

server {
  listen 80;
  server_name choirchaos.goatlessband.com;

  # fix mime type for .mjs files
  include mime.types;
  types {
    application/javascript js mjs;
  }
  default_type application/octet-stream;

  root /usr/share/nginx/html;
  index index.html;

  # Serve static files
  location / {
    # Add CORS headers
    add_header 'Access-Control-Allow-Origin' 'https://choirchaos.com' always;
    add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS' always;
    add_header 'Access-Control-Allow-Headers' 'Origin, Content-Type, Accept, Authorization' always;
    add_header 'Access-Control-Allow-Credentials' 'true' always;
    add_header 'Cache-Control' $cache_control;

    # Handle SPA fallback
    try_files $uri $uri/ /index.html;

    # Preflight CORS requests
    if ($request_method = OPTIONS) {
      add_header 'Access-Control-Allow-Origin' 'https://choirchaos.com' always;
      add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS' always;
      add_header 'Access-Control-Allow-Headers' 'Origin, Content-Type, Accept, Authorization' always;
      add_header 'Access-Control-Allow-Credentials' 'true' always;
      add_header 'Content-Length' 0;
      add_header 'Content-Type' 'text/plain; charset=UTF-8';
      return 204;
    }
  }

  error_page 404 /index.html;
}
